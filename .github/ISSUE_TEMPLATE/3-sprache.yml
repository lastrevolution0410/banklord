name: Neue Sprache anfragen / Request a language
description: Banklord in einer weiteren Sprache. / Banklord in another language.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Sprache / Language
      placeholder: "z. B. Français (frFR)"
    validations: {required: true}
  - type: dropdown
    id: where
    attributes:
      label: Wo gebraucht? / Where needed?
      multiple: true
      options: [Addon im Spiel / in game, Website, Companion / Setup]
    validations: {required: true}
  - type: dropdown
    id: help
    attributes:
      label: Kannst du beim Übersetzen helfen? / Can you help translate?
      options: [Ja / yes, Vielleicht / maybe, Nein / no]
  - type: textarea
    id: notes
    attributes:
      label: Anmerkungen / Notes
